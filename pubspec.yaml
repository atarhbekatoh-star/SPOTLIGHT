name: my_awesome_app

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0+1
  multi_charts: ^0.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  path: ^1.9.1
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  supabase_flutter: ^2.5.0
  record_windows: ^1.0.3
  record_web: ^1.0.5
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

